<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Glow and shadow filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <!-- Gradient definition -->
    <linearGradient id="purpleCyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b829f2" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
  </defs>
  
  <!-- Dark backdrop matching our theme background -->
  <rect width="512" height="512" rx="100" fill="#07050f" stroke="url(#purpleCyanGrad)" stroke-width="10"/>
  
  <!-- Glowing background elements -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="rgba(184, 41, 242, 0.1)" stroke-width="20" filter="url(#glow)"/>
  
  <!-- Tailoring Needle & Thread SVG Graphic -->
  <g transform="translate(6, 6)" filter="url(#glow)">
    <!-- Swirling Thread -->
    <path d="M160 380 C 130 320, 110 200, 200 160 C 270 130, 370 200, 350 280 C 330 350, 240 380, 280 440" 
          fill="none" stroke="url(#purpleCyanGrad)" stroke-width="16" stroke-linecap="round"/>
    
    <!-- Needle -->
    <path d="M380 120 L 190 310" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Needle Eye -->
    <ellipse cx="360" cy="140" rx="15" ry="6" transform="rotate(-45 360 140)" fill="#07050f" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
